name: Weekly rebuild

# Triggers a fresh Vercel production build once a week (and on demand), so the build-time
# stats (GitHub repo count, and LeetCode if enabled in src/data/site.ts) stay current.
# Needs the repository secret VERCEL_DEPLOY_HOOK_URL (see DEPLOY.md, step 6).
on:
  schedule:
    - cron: '30 3 * * 1' # Mondays 03:30 UTC (09:00 IST)
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Repository secret VERCEL_DEPLOY_HOOK_URL is not set. See DEPLOY.md, step 6."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$HOOK"
          echo "Deploy hook triggered."
