name: CI

# Type-check, lint, format-check and build every pull request (and every push to main), and
# make sure the CSP hash in vercel.json still matches the built theme snippet.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          # optional: lifts GitHub's API rate limit for the build-time repo count
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: CSP in sync with the build
        run: npm run csp:check
